<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Mystery Game</title>
    <link rel="stylesheet" href="./game.css">
    <script defer src="./game.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed:ital,wght@0,400..700;1,400..700&family=Protest+Guerrilla&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Libre+Caslon+Condensed:ital,wght@0,400..700;1,400..700&family=Protest+Guerrilla&display=swap');

<body>
    <img id="Conf-DC" src="./assets/Confidential Detective Case Files.png" alt="footsteps image">
<div class="header">
    
    <div class="top-section">
        <div class="time-score">

 </div>

    </div>
    <h1>Memory Mystery</h1>
    <hr id="bottom-dash">
 </header>
 <div id="music-levels-div">

      <select name="levels" id="levels">
        <option value="Easy">Easy</option>
        <option value="Hard">Hard</option>
       </select>
</div>
 </div>
 <audio id="background-music" src="./assets/main-theme.mp3" loop="loop"></audio>

    <img class="back-card-image" src="./assets/back-card-image.png" alt="back card image">

    <img class="back-card-image" src="./assets/back-card-image.png" alt="back card image">
    <img class="back-card-image" src="./assets/back-card-image.png" alt="back card image">
    <img class="back-card-image" src="./assets/back-card-image.png" alt="back card image">
    <img class="back-card-image" src="./assets/back-card-image.png" alt="back card image">
    <img class="back-card-image" src="./assets/back-card-image.png" alt="back card image">
    <img class="back-card-image" src="./assets/back-card-image.png" alt="back card image">
    <img class="back-card-image" src="./assets/back-card-image.png" alt="back card image">
    <img class="back-card-image" src="./assets/back-card-image.png" alt="back card image">
    <div class="hard-cards">
     <img class="back-card-image" src="./assets/back-card-image.png" alt="back card image">
     <img class="back-card-image" src="./assets/back-card-image.png" alt="back card image">
     <img class="back-card-image" src="./assets/back-card-image.png" alt="back card image">
     <img class="back-card-image" src="./assets/back-card-image.png" alt="back card image">
    </div>
    
 </div>
     <div class="msg-btn"> 
        <button id="restart-btn">Replay</button> 
        <!-- <button id="bonus-btn"><a href="./bonusGame.html">Bonus Round</a> </button></div>  -->
    </div>
    <img id="culprit-image" src="./assets/culprit-sec-img.png" alt="Detective Conan Culprit Image">
    <img id="capsule-image" src="./assets/capsule.png" alt="APT capsule Image">

</html>
